name: LeadCollector

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-collector:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:extension
      - run: pnpm build:api
      - run: pnpm type-check
      - run: pnpm test
      - run: node --test apps/api/test/collector-contract.test.mjs
