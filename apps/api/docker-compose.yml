services:
  api:
    build:
      context: .
    image: evomesh-leadcollector-api
    # Optional Linux host-network operation keeps the process on host loopback.
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: ${PORT:-5050}
      LEADCOLLECTOR_AGENT_TOKEN: ${LEADCOLLECTOR_AGENT_TOKEN:?Set an agent token}
      LEADCOLLECTOR_WORKER_TOKEN: ${LEADCOLLECTOR_WORKER_TOKEN:?Set a worker token}
      LEADCOLLECTOR_STATE_DIR: /var/lib/leadcollector
    volumes:
      - leadcollector:/var/lib/leadcollector
volumes:
  leadcollector:
